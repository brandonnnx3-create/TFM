name: Publicar en GitHub Pages

# Cada cambio que se sube a esta rama se publica solo. También se puede
# correr a mano desde la pestaña Actions.
on:
  push:
    branches: [claude/dazzling-johnson-faehwf]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos cambios seguidos, se termina de publicar el primero.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Sin paso de compilación: la página es HTML, CSS y JS tal cual.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
